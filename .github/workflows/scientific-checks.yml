name: Bounded scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-local-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check finite evidence and rerun owned local experiments
        shell: bash
        run: |
          set -euo pipefail
          export RAW="$RUNNER_TEMP/p039-scientific-output"
          mkdir -p "$RAW"
          timeout --signal=TERM --kill-after=15s 900s bash -euo pipefail <<'BASH'
          ulimit -v 3328000
          ulimit -t 600
          run() {
            local label="$1"
            shift
            python -B -S "$@" 2>&1 | tee "$RAW/$label.log"
          }
          run tests -m unittest discover -s tests -v
          run frontier-limits -m unittest discover -s regressions -p test_frontier_limits.py -v
          run retained-results verify_results.py --results results
          run exact-comparisons comparisons.py --verify
          run oracle-fixed compare_oracle_fixed.py --verify
          run retained-identities retention_checks.py --verify
          run example examples/run_contract.py --output "$RAW/example"
          run fresh-experiments reproduce.py --phase all --output "$RAW/reproduced"
          run fresh-result-check verify_results.py --results "$RAW/reproduced" --compare results
          BASH
      - name: Preserve raw output even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p039-scientific-raw-output
          path: ${{ runner.temp }}/p039-scientific-output
          if-no-files-found: warn
          retention-days: 14
